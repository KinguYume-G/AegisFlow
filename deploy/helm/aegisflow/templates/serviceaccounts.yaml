{{- range $component := list "core" "prometheus" "grafana" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegisflow.fullname" $ }}-{{ $component }}
  labels:
    {{- include "aegisflow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegisflow.fullname" . }}-worker
  labels:
    {{- include "aegisflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
automountServiceAccountToken: false
{{- end }}
