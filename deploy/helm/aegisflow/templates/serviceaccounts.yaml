{{- range $component := list "core" "worker" "prometheus" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegisflow.fullname" $ }}-{{ $component }}
  labels:
    {{- include "aegisflow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: false
{{- end }}
