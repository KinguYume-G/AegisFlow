{{- $root := . -}}
{{- range $service := list (dict "name" "core" "port" 8000) (dict "name" "postgres" "port" 5432) (dict "name" "redis" "port" 6379) (dict "name" "temporal-postgres" "port" 5432) (dict "name" "temporal" "port" 7233) (dict "name" "prometheus" "port" 9090) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegisflow.fullname" $root }}-{{ $service.name }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "aegisflow.name" $root }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: {{ $service.name }}
  ports:
    - name: service
      port: {{ $service.port }}
      targetPort: {{ $service.port }}
{{- end }}
