---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisflow.fullname" . }}-redis
spec:
  replicas: 1
  selector:
    matchLabels: &redisLabels
      app.kubernetes.io/name: {{ include "aegisflow.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata: {labels: *redisLabels}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: {{ .Values.images.redis | quote }}
          args: ["--save", "", "--appendonly", "no"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 2
            periodSeconds: 3
          resources: {{- toYaml .Values.dependencyResources | nindent 12 }}
