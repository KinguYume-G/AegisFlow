apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegisflow.fullname" . }}-runtime
data:
  APP_ENV: development
  TEMPORAL_ADDRESS: {{ include "aegisflow.fullname" . }}-temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: aegisflow-delivery
  LANGGRAPH_STRICT_MSGPACK: "true"
  OTEL_SERVICE_NAME: aegisflow-core
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegisflow.fullname" . }}-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: aegisflow-core
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ include "aegisflow.fullname" . }}-core:8000"]
