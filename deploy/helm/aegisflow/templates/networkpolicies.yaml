apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisflow.fullname" . }}-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisflow.fullname" . }}-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "aegisflow.fullname" . }}-core}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: core}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/component: prometheus}}
        - podSelector: {matchLabels: {aegisflow.io/access-core: "true"}}
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: redis}}}]
      ports: [{protocol: TCP, port: 6379}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: temporal}}}]
      ports: [{protocol: TCP, port: 7233}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "aegisflow.fullname" . }}-worker}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: worker}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: temporal}}}]
      ports: [{protocol: TCP, port: 7233}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "aegisflow.fullname" . }}-prometheus}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: prometheus}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {aegisflow.io/access-prometheus: "true"}}}]
      ports: [{protocol: TCP, port: 9090}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: core}}}]
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "aegisflow.fullname" . }}-smoke}
spec:
  podSelector: {matchLabels: {aegisflow.io/access-core: "true"}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: core}}}]
      ports: [{protocol: TCP, port: 8000}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: prometheus}}}]
      ports: [{protocol: TCP, port: 9090}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "aegisflow.fullname" . }}-temporal}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: temporal}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/component: core}}
        - podSelector: {matchLabels: {app.kubernetes.io/component: worker}}
      ports: [{protocol: TCP, port: 7233}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: temporal-postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: temporal}}}]
      ports: [{protocol: TCP, port: 7233}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "aegisflow.fullname" . }}-postgres}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/component: core}}
        - podSelector: {matchLabels: {app.kubernetes.io/component: worker}}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "aegisflow.fullname" . }}-redis}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: redis}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/component: core}}}]
      ports: [{protocol: TCP, port: 6379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "aegisflow.fullname" . }}-temporal-postgres}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: temporal-postgres}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/component: temporal}}}]
      ports: [{protocol: TCP, port: 5432}]
