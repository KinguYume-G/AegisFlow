name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: aegisflow_ci
          POSTGRES_PASSWORD: aegisflow_ci
          POSTGRES_DB: aegisflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegisflow_ci -d aegisflow_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://aegisflow_ci:aegisflow_ci@localhost:5432/aegisflow_ci
      LANGGRAPH_DATABASE_URL: postgresql://aegisflow_ci:aegisflow_ci@localhost:5432/aegisflow_ci
      LANGGRAPH_STRICT_MSGPACK: "true"
      TEMPORAL_ADDRESS: localhost:7233
      POSTGRES_USER: aegisflow_ci
      POSTGRES_PASSWORD: aegisflow_ci
      POSTGRES_DB: aegisflow_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked

      - name: Run evaluation regression gate
        run: >-
          uv run --locked python -m aegisflow_core.evaluation.regression
          --baseline src/aegisflow_core/evaluation/data/regression_baseline_v1.json
          --candidate src/aegisflow_core/evaluation/data/regression_candidate_v1.json
          --thresholds src/aegisflow_core/evaluation/data/regression_thresholds_v1.json
          --output evaluation-evidence/regression-decision.json

      - name: Upload evaluation regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evaluation-regression-${{ github.run_id }}
          path: evaluation-evidence/regression-decision.json
          if-no-files-found: error
          retention-days: 30

      - name: Start pinned Temporal test service
        run: docker compose up -d --wait temporal

      - name: Apply database migrations
        run: uv run --locked alembic upgrade head

      - name: Verify migration idempotency
        run: uv run --locked alembic upgrade head

      - name: Record Gate 3 environment
        shell: bash
        run: |
          mkdir -p gate3-evidence
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}"
            uv run --locked python --version
            uv --version
          } | tee gate3-evidence/environment.txt

      - name: Run Gate 3 security regression
        shell: bash
        run: |
          set -o pipefail
          uv run --locked python -m pytest -q \
            tests/control_plane/test_oidc.py \
            tests/control_plane/test_rbac.py \
            tests/control_plane/test_audit_service.py \
            tests/control_plane/test_registry_service.py \
            tests/control_plane/test_tenant_scope.py \
            tests/gateway/mcp/test_registry_gate.py \
            tests/gateway/policy/test_contextual.py \
            tests/gateway/policy/test_injection.py \
            tests/gateway/sandbox/test_runner.py \
            tests/security/test_cross_tenant_isolation.py \
            tests/security/test_gate3_contract.py \
            --junitxml=gate3-evidence/junit.xml \
            2>&1 | tee gate3-evidence/security-gate.log

      - name: Scan tracked files for credential signatures
        shell: bash
        run: |
          set -o pipefail
          private_prefix='-----BEGIN '
          private_suffix='PRIVATE KEY-----'
          pattern="(${private_prefix}(RSA |EC |OPENSSH )?${private_suffix}|gh[pousr]_[A-Za-z0-9]{36,}|sk-[A-Za-z0-9]{20,})"
          if git grep -I -n -E "$pattern" -- . ':!uv.lock' \
            ':!tests/control_plane/test_audit_service.py' \
            ':!tests/runtime/test_tracing.py' > gate3-evidence/secret-scan.log; then
            cat gate3-evidence/secret-scan.log
            echo "Credential-like content detected in tracked files." >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "No credential signatures detected in tracked files." | tee gate3-evidence/secret-scan.log
          fi

      - name: Upload Gate 3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate3-security-evidence-${{ github.run_id }}
          path: gate3-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Run tests and coverage gate
        run: >-
          uv run --locked python -m pytest
          --cov=aegisflow_core
          --cov-report=term-missing

      - name: Verify migration rollback
        run: uv run --locked alembic downgrade base

      - name: Verify migration reapply
        run: uv run --locked alembic upgrade head

      - name: Build Core, Temporal worker, and sandbox broker container images
        env:
          APP_ENV: test
          POSTGRES_USER: ci-placeholder
          POSTGRES_PASSWORD: ci-placeholder-only
          POSTGRES_DB: aegisflow_ci
        run: docker compose build core temporal-worker sandbox-broker

      - name: Stop Temporal test service
        if: always()
        run: docker compose stop temporal temporal-postgres
