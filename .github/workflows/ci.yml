name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: aegisflow_ci
          POSTGRES_PASSWORD: aegisflow_ci
          POSTGRES_DB: aegisflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegisflow_ci -d aegisflow_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://aegisflow_ci:aegisflow_ci@localhost:5432/aegisflow_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked

      - name: Apply database migrations
        run: uv run --locked alembic upgrade head

      - name: Verify migration idempotency
        run: uv run --locked alembic upgrade head

      - name: Run tests and coverage gate
        run: >-
          uv run --locked python -m pytest
          --cov=aegisflow_core
          --cov-report=term-missing

      - name: Verify migration rollback
        run: uv run --locked alembic downgrade base

      - name: Verify migration reapply
        run: uv run --locked alembic upgrade head

      - name: Build Core container image
        env:
          APP_ENV: test
          POSTGRES_USER: ci-placeholder
          POSTGRES_PASSWORD: ci-placeholder-only
          POSTGRES_DB: aegisflow_ci
        run: docker compose build core
