name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked

      - name: Run tests and coverage gate
        run: >-
          uv run --locked python -m pytest
          --cov=aegisflow_core
          --cov-report=term-missing

      - name: Build Core container image
        env:
          APP_ENV: test
          POSTGRES_USER: ci-placeholder
          POSTGRES_PASSWORD: ci-placeholder-only
          POSTGRES_DB: aegisflow_ci
        run: docker compose build core
