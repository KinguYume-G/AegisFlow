name: Langfuse smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: langfuse-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: langfuse-development
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://smoke:unused@localhost/smoke
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_TRACING_ENVIRONMENT: ${{ vars.LANGFUSE_TRACING_ENVIRONMENT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked

      - name: Verify Langfuse write and read path
        run: uv run --locked python -m aegisflow_core.runtime.langfuse_smoke
