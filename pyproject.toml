[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "aegisflow-core"
version = "0.1.0"
description = "AegisFlow modular monolith application core"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegisflow_core"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["aegisflow_core"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
