[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "aegisflow-core"
version = "0.1.0"
description = "AegisFlow modular monolith application core"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "docker>=7,<8; sys_platform != 'win32'",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langfuse>=4.14,<5",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "pyjwt[crypto]>=2.10,<3",
    "pydantic>=2.13,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary,pool]>=3.3,<4",
    "sqlalchemy>=2.0,<3",
    "temporalio>=1.31,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegisflow_core"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "database: requires a real PostgreSQL database migrated to Alembic head",
    "docker: requires a reachable Docker sandbox broker",
    "asyncio: asynchronous unit or integration test",
    "real_github: protected manual test that writes only to the configured Fixture repository",
    "temporal: requires a reachable pinned Temporal test service",
]

[tool.coverage.run]
branch = true
source = ["aegisflow_core"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
